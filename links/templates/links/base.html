{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Shortify — Simple and fast URL shortening service."
    >

    <title>
        {% block title %}Shortify{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'links/css/style.css' %}"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <header class="navbar">
        <div class="container navbar-content">

            <a href="{% url 'links:home' %}" class="brand">
                <i class="bi bi-link-45deg"></i>
                Shortify
            </a>

            <nav>
                <a href="{% url 'links:home' %}">
                    Home
                </a>

                <a href="#">
                    Dashboard
                </a>
            </nav>

        </div>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer class="footer">
        <div class="container">
            <p>
                &copy; 2026 Shortify. Built with Django.
            </p>
        </div>
    </footer>


    <script src="{% static 'links/js/app.js' %}"></script>

</body>
</html>
